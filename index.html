<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Establece el set de caracteres a UTF-8 -->
    <meta charset="UTF-8">
    <!-- Configuración inicial para la responsividad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo de la pagina -->
    <title>Google Clone</title>
    <!-- Iconos de google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Importar la hoja de estilos -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
      <main class="main-container">
        <!-- Logotipo oficial de Google -->
        <img class="logo" src="google-logo.png" alt="Google Logo">

        <!-- Formulario que agrupa la búsqueda y activa los eventos -->
        <form id="search-form" action="https://google.com/search" method="GET">
            
            <!-- Barra de búsqueda interactiva -->
            <div class="search-box">
                <!-- Icono de lupa -->
                <svg class="icon icon-search" focusable="false" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                
                <!-- El atributo 'name="q"' es obligatorio para que Google reciba el término -->
                <input type="text" id="search-input" name="q" autocomplete="off" required>
                
                <!-- Icono de micrófono -->
                <svg class="icon icon-mic" viewBox="0 0 24 24"><path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path><path fill="#34a853" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path></svg>
            </div>

            <!-- Botones de acción -->
            <div class="buttons-container">
                <!-- El type="submit" hace que mande el formulario al hacer click -->
                <button type="submit" class="action-btn">Buscar con Google</button>
                <!-- El botón "Suerte" usará JS para una redirección especial -->
                <button type="button" id="lucky-btn" class="action-btn">Me siento con suerte</button>
            </div>

        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
